<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><style>
:root{--a:#ff5fa2;--bg:#1b1035;--c:#2a1b52;--c2:#3a2870;--t:#fdf3d8;--m:#b9a8e8;--b:#6f5bd0;--sh:#000;--ok:#39ff88;--wn:#ffd23f;--er:#ff4d4d}
body.l{--bg:#f2e6c4;--c:#fff9e6;--c2:#ead9a8;--t:#1d1a14;--m:#6a5f45;--b:#1d1a14;--sh:#1d1a14;--ok:#1f9d55;--wn:#c98a00;--er:#d62828}
*{box-sizing:border-box;border-radius:0!important}
body{margin:0;font:16px/1.45 "Courier New",Courier,monospace;background:var(--bg);color:var(--t);background-image:radial-gradient(var(--b) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000014 2px 3px)}
h1,h2,h3,.kpi b,.btn,nav button,.seg button{font-family:"Press Start 2P","Courier New",monospace}
.wrap{display:flex;min-height:100vh}
nav{width:236px;background:var(--c);border-right:4px solid var(--b);padding:16px 12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh}
nav h1{font-size:11px;line-height:1.5;margin:0 0 12px;display:flex;gap:10px;align-items:center;color:var(--a);text-transform:uppercase}
nav h1 i{width:22px;height:22px;background:var(--a);border:3px solid var(--b);box-shadow:3px 3px 0 var(--sh);flex:none}
nav button{all:unset;cursor:pointer;padding:10px 10px;font-size:9px;line-height:1.5;color:var(--m);border:3px solid transparent;text-transform:uppercase}
nav button:hover{color:var(--t);border-color:var(--b)}
nav button.on{background:var(--a);color:#fff;border-color:var(--b);box-shadow:4px 4px 0 var(--sh)}
nav .sp{flex:1}
main{flex:1;padding:28px;max-width:1120px;min-width:0}
h2{margin:0 0 20px;font-size:16px;line-height:1.6;text-transform:uppercase;text-shadow:3px 3px 0 var(--sh);color:var(--a)}
h3{margin:0 0 12px;font-size:11px;text-transform:uppercase;line-height:1.6}
.card{background:var(--c);border:3px solid var(--b);box-shadow:6px 6px 0 var(--sh);padding:16px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:18px}
.kpi{background:var(--c);border:3px solid var(--b);box-shadow:5px 5px 0 var(--sh);padding:14px}
.kpi b{display:block;font-size:20px;line-height:1.4;color:var(--wn);margin-bottom:6px}
.kpi span{color:var(--m);font-size:13px;text-transform:uppercase}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mu{color:var(--m)}
input,select,textarea{width:100%;background:var(--bg);border:3px solid var(--b);color:var(--t);padding:8px 10px;font:inherit;margin:4px 0 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:3px 3px 0 var(--sh)}
label{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.5px}
.btn{background:var(--a);color:#fff;border:3px solid var(--b);padding:10px 14px;cursor:pointer;font-size:10px;line-height:1.4;text-transform:uppercase;box-shadow:4px 4px 0 var(--sh)}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.g{background:var(--c2);color:var(--t)}.btn.r{background:transparent;color:var(--er);box-shadow:none;border-color:transparent}.btn.r:hover{border-color:var(--er)}
.btn.s{padding:6px 8px;font-size:8px;box-shadow:3px 3px 0 var(--sh)}
.pill{font-size:12px;padding:1px 8px;border:2px solid var(--b);background:var(--c2);color:var(--t);text-transform:uppercase}
.p-High,.od{color:var(--er)}.p-Medium{color:var(--wn)}.p-Low{color:var(--ok)}
.seg{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.seg button{flex:1;background:var(--c2);border:3px solid var(--b);color:var(--t);padding:8px 4px;cursor:pointer;font-size:8px;line-height:1.5;text-transform:uppercase}
.seg button:hover{border-color:var(--a)}.seg button.on{background:var(--a);color:#fff;box-shadow:3px 3px 0 var(--sh)}
.bar{height:16px;border:3px solid var(--b);background:var(--bg);display:flex;overflow:hidden}
.bar i{display:block;height:100%;background-image:repeating-linear-gradient(90deg,#0000 0 6px,#0003 6px 8px)}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}.tasks .card{margin:0}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 6px;border-bottom:2px dashed var(--b)}
th{color:var(--a);font-size:12px;text-transform:uppercase;font-weight:700}
code{background:var(--bg);border:2px solid var(--b);padding:1px 6px;color:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal>b{text-align:center;color:var(--a);font-size:12px;text-transform:uppercase}
.cd{min-height:90px;background:var(--c);border:3px solid var(--b);padding:4px;overflow:hidden}.cd.e{background:none;border:0}
.cd.today{border-color:var(--a);box-shadow:4px 4px 0 var(--a)}
.chip{font-size:12px;padding:1px 5px;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111;border:2px solid var(--sh)}
.s-todo{background:#a8a8c8}.s-doing{background:var(--wn)}.s-done{background:var(--ok)}
.bar .s-todo{background-color:#a8a8c8}.bar .s-doing{background-color:var(--wn)}.bar .s-done{background-color:var(--ok)}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;padding:16px;z-index:60}#modal.on{display:flex}
#modal .card{width:100%;max-width:480px;max-height:90vh;overflow:auto;margin:0}
#toasts{position:fixed;right:16px;top:16px;display:flex;flex-direction:column;gap:10px;z-index:70}
.toast{background:var(--c);border:3px solid var(--a);box-shadow:5px 5px 0 var(--sh);padding:10px 14px;max-width:300px}
.login{max-width:400px;margin:10vh auto;padding:20px;position:relative}
.login h2{text-align:center;font-size:18px;margin-bottom:6px}.login h2::after{content:"PRESS START";display:block;font-size:8px;color:var(--wn);margin-top:10px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
@media(max-width:760px){.wrap{flex-direction:column}nav{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:4px solid var(--b)}nav h1,nav .sp{display:none}main{padding:14px}}
</style></head><body><div id="app"></div><div id="modal"></div><div id="toasts"></div>
<script>
const ST={todo:'Not started',doing:'In progress',done:'Completed'};let S,cred=JSON.parse(sessionStorage.c||'null'),view='dash',cal=new Date(),mode='user';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),td=()=>iso(new Date()),tm=()=>iso(new Date(Date.now()+864e5));
const un=id=>(S.users.find(u=>u.id===id)||{}).name||'Unassigned',admin=()=>cred&&cred.role==='admin';
if(localStorage.th==='l')document.body.className='l';
async function api(action,d={}){const h={'Content-Type':'application/json'};if(cred)h[cred.role==='admin'?'x-admin':'x-token']=cred.v;const r=await fetch('/api',{method:'POST',headers:h,body:JSON.stringify({action,...d})});const j=await r.json().catch(()=>({error:'API not found. Make sure index.html and the api folder are at the ROOT of the repo, then redeploy.'}));if(!r.ok)throw new Error(j.error);return j}
async function load(){try{S=await api('get')}catch(e){return logout()}document.documentElement.style.setProperty('--a',S.settings.accent);document.title=S.settings.name;render();notify()}
async function login(){const v=$('#cv').value;cred={role:mode==='admin'?'admin':'user',v};try{if(mode==='admin')await api('login');else{const r=await api('userlogin',{username:$('#cu').value,password:v});cred.v=r.token}sessionStorage.c=JSON.stringify(cred);view='dash';load()}catch(e){cred=null;$('#err').textContent=e.message}}
async function chpw(){const o=prompt('Current password');if(o===null)return;const n=prompt('New password (min 4 characters)');if(!n)return;try{await api('changePw',{old:o,new:n});toast('Password changed ✓')}catch(e){alert(e.message)}}
function loginH(){return`<div class="login card"><h2>Project Hub</h2><div class="seg"><button class="${mode==='user'?'on':''}" onclick="mode='user';render()">Team member</button><button class="${mode==='admin'?'on':''}" onclick="mode='admin';render()">Project manager</button></div><br>${mode==='user'?`<label>Username</label><input id="cu" autocomplete="username" autofocus>`:''}<label>${mode==='admin'?'Admin password':'Password'}</label><input id="cv" type="password" onkeydown="event.key==='Enter'&&login()"><button class="btn" style="width:100%" onclick="login()">Sign in</button><p id="err" class="od"></p></div>`}
function logout(){sessionStorage.removeItem('c');cred=null;S=null;render()}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),9000)}
function K(ts,ls){const d=ts.filter(t=>t.status==='done'),wd=d.filter(t=>t.due),on=wd.filter(t=>iso(new Date(t.completedAt||Date.now()))<=t.due),wk=Date.now()-6048e5;
return{n:ts.length,done:d.length,doing:ts.filter(t=>t.status==='doing').length,todo:ts.filter(t=>t.status==='todo').length,over:ts.filter(t=>t.status!=='done'&&t.due&&t.due<td()).length,rate:ts.length?Math.round(d.length/ts.length*100):0,ontime:wd.length?Math.round(on.length/wd.length*100):100,hrs:+ls.filter(l=>l.ts>wk).reduce((a,l)=>a+l.hours,0).toFixed(1)}}
function kpiH(k){const c=(v,l,x='')=>`<div class="kpi"><b ${x}>${v}</b><span>${l}</span></div>`;return`<div class="grid">${c(k.n,'Total tasks')}${c(k.rate+'%','Completion rate')}${c(k.doing,'In progress')}${c(k.over,'Overdue',k.over?'class="od"':'')}${c(k.ontime+'%','On-time delivery')}${c(k.hrs+'h','Hours logged (7d)')}</div>
<div class="card"><div class="row"><h3>Status breakdown</h3><span class="mu">${k.todo} not started · ${k.doing} in progress · ${k.done} completed</span></div><div class="bar">${['todo','doing','done'].map(s=>`<i class="s-${s}" style="width:${k.n?k[s]/k.n*100:0}%"></i>`).join('')}</div></div>`}
function render(){const A=$('#app');if(!cred||!S){A.innerHTML=loginH();return}
const items=admin()?[['dash','📊 Dashboard'],['tasks','✅ Tasks'],['cal','📅 Calendar'],['team','👥 Team'],['logs','📝 Activity'],['set','⚙️ Settings']]:[['dash','📊 My KPIs'],['tasks','✅ My tasks'],['log','📝 Work log'],['cal','📅 Calendar']];
A.innerHTML=`<div class="wrap"><nav><h1><i></i>${esc(S.settings.name)}</h1>${items.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="view='${k}';render()">${l}</button>`).join('')}<div class="sp"></div><button onclick="Notification.requestPermission().then(()=>toast('Alerts: '+Notification.permission))">🔔 Enable alerts</button><button onclick="localStorage.th=document.body.classList.toggle('l')?'l':'d'">🌓 Theme</button>${admin()?'':'<button onclick="chpw()">🔑 Password</button>'}<button onclick="logout()">↩ Sign out${admin()?'':' ('+esc(S.me.name)+')'}</button></nav><main>${V[view]()}</main></div>`}
const V={dash(){let h='<h2>'+(admin()?'Team dashboard':'Hi, '+esc(S.me.name))+'</h2>'+kpiH(K(S.tasks,S.logs));
if(admin())h+=`<div class="card"><h3>Per member</h3><table><tr><th>Member</th><th>Tasks</th><th>Done</th><th>Overdue</th><th>Hours 7d</th><th style="width:30%">Progress</th></tr>${S.users.map(u=>{const k=K(S.tasks.filter(t=>t.assignee===u.id),S.logs.filter(l=>l.user===u.id));return`<tr><td>${esc(u.name)}</td><td>${k.n}</td><td>${k.done}</td><td class="${k.over?'od':''}">${k.over}</td><td>${k.hrs}</td><td><div class="bar"><i class="s-done" style="width:${k.rate}%"></i></div></td></tr>`}).join('')||'<tr><td class="mu">Add team members first</td></tr>'}</table></div>`;
else h+=`<div class="card"><h3>Up next</h3>${S.tasks.filter(t=>t.status!=='done').sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1).slice(0,5).map(t=>`<div class="row" style="padding:6px 0"><span>${esc(t.title)}</span><span class="mu ${t.due<td()?'od':''}">${t.due||'—'}</span></div>`).join('')||'<span class="mu">Nothing pending 🎉</span>'}</div>`;return h},
tasks(){const ts=[...S.tasks].sort((a,b)=>(a.status==='done')-(b.status==='done')||((a.due||'9')>(b.due||'9')?1:-1));
if(admin())return`<div class="row"><h2>Tasks</h2><button class="btn" onclick="tform()">+ New task</button></div><div class="card"><table><tr><th>Task</th><th>Assignee</th><th>Due</th><th>Priority</th><th>Status</th><th></th></tr>${ts.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(un(t.assignee))}</td><td class="${t.status!=='done'&&t.due&&t.due<td()?'od':''}">${t.due||'—'}</td><td class="p-${t.priority}">${t.priority}</td><td><span class="pill">${ST[t.status]}</span></td><td><button class="btn g s" onclick="tform('${t.id}')">Edit</button> <button class="btn r s" onclick="confirm('Delete task?')&&api('delTask',{id:'${t.id}'}).then(load)">✕</button></td></tr>`).join('')||'<tr><td class="mu">No tasks yet</td></tr>'}</table></div>`;
return`<h2>My tasks</h2><div class="tasks">${ts.map(t=>`<div class="card"><div class="row"><b>${esc(t.title)}</b><span class="pill p-${t.priority}">${t.priority}</span></div><p class="mu">${esc(t.description)||'No description'}</p><div class="mu ${t.status!=='done'&&t.due&&t.due<td()?'od':''}">📅 ${t.due||'No due date'}${t.status!=='done'&&t.due&&t.due<td()?' · Overdue':''}</div><div class="seg">${Object.entries(ST).map(([k,v])=>`<button class="${t.status===k?'on':''}" onclick="api('setStatus',{id:'${t.id}',status:'${k}'}).then(load)">${v}</button>`).join('')}</div></div>`).join('')||'<p class="mu">No tasks assigned yet.</p>'}</div>`},
log(){return`<h2>Work log</h2><div class="card"><label>What are you working on?</label><textarea id="lt" rows="3" placeholder="Describe your work..."></textarea><div class="row"><div style="flex:2"><label>Related task</label><select id="lk"><option value="">General</option>${S.tasks.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></div><div style="flex:1"><label>Hours</label><input id="lh" type="number" min="0" step="0.25" value="1"></div></div><button class="btn" onclick="addLog()">Log work</button></div>${logsH(S.logs)}`},
logs(){return'<h2>Team activity</h2>'+logsH(S.logs)},
cal(){const y=cal.getFullYear(),m=cal.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let c='';for(let i=0;i<f;i++)c+='<div class="cd e"></div>';
for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d));c+=`<div class="cd ${k===td()?'today':''}"><small class="mu">${d}</small>${S.tasks.filter(t=>t.due===k).map(t=>`<div class="chip s-${t.status}" onclick="detail('${t.id}')">${esc(t.title)}</div>`).join('')}</div>`}
return`<div class="row"><h2>${cal.toLocaleString('default',{month:'long',year:'numeric'})}</h2><div><button class="btn g s" onclick="cal=new Date(y0(),cal.getMonth()-1,1);render()">‹</button> <button class="btn g s" onclick="cal=new Date();render()">Today</button> <button class="btn g s" onclick="cal=new Date(y0(),cal.getMonth()+1,1);render()">›</button></div></div><div class="cal">${'Sun Mon Tue Wed Thu Fri Sat'.split(' ').map(d=>`<b>${d}</b>`).join('')}${c}</div><p class="mu">Reminders pop up for tasks that are due tomorrow, due today or overdue. Click “Enable alerts” for browser notifications.</p>`},
team(){return`<h2>Team</h2><div class="card"><h3>Add member</h3><div class="row"><div style="flex:1"><label>Full name</label><input id="un"></div><div style="flex:1"><label>Username</label><input id="uu"></div><div style="flex:1"><label>Password</label><input id="up"></div><div style="flex:1"><label>Role (optional)</label><input id="ut"></div></div><button class="btn" onclick="api('addUser',{name:$('#un').value,username:$('#uu').value,password:$('#up').value,title:$('#ut').value}).then(load).catch(e=>alert(e.message))">Add</button><p class="mu">Give each person their username and password. Members can change their own password after signing in.</p></div><div class="card"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Tasks</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td><code>${esc(u.username)}</code></td><td>${esc(u.title)}</td><td>${S.tasks.filter(t=>t.assignee===u.id).length}</td><td><button class="btn g s" onclick="const p=prompt('New password');p&&api('resetPw',{id:'${u.id}',password:p}).then(()=>toast('Password reset ✓')).catch(e=>alert(e.message))">Reset pw</button> <button class="btn r s" onclick="confirm('Remove member?')&&api('delUser',{id:'${u.id}'}).then(load)">Remove</button></td></tr>`).join('')||'<tr><td class="mu">No members yet</td></tr>'}</table></div>`},
set(){return`<h2>Settings</h2><div class="card"><label>Project name</label><input id="sn" value="${esc(S.settings.name)}"><label>Accent color</label><input id="sa" type="color" value="${S.settings.accent}" style="height:42px"><button class="btn" onclick="api('settings',{settings:{name:$('#sn').value,accent:$('#sa').value}}).then(load)">Save</button></div>`}};
const y0=()=>cal.getFullYear();
function logsH(ls){return`<div class="card">${[...ls].reverse().map(l=>`<div style="padding:9px 0;border-bottom:1px solid var(--b)"><div class="row"><b>${admin()?esc(un(l.user)):''}${l.task?` <span class="pill">${esc((S.tasks.find(t=>t.id===l.task)||{}).title||'Task')}</span>`:''}</b><span class="mu">${new Date(l.ts).toLocaleString()} · ${l.hours}h</span></div>${esc(l.text)}</div>`).join('')||'<span class="mu">No logs yet</span>'}</div>`}
async function addLog(){try{await api('addLog',{text:$('#lt').value,task:$('#lk').value,hours:$('#lh').value});toast('Logged ✓');load()}catch(e){alert(e.message)}}
function modal(h){$('#modal').innerHTML=`<div class="card">${h}</div>`;$('#modal').classList.add('on')}function closeM(){$('#modal').classList.remove('on');$('#modal').innerHTML=''}
function detail(id){const t=S.tasks.find(x=>x.id===id);modal(`<h3>${esc(t.title)}</h3><p>${esc(t.description)||'No description'}</p><p class="mu">Due ${t.due} · ${t.priority} · ${ST[t.status]}${admin()?' · '+esc(un(t.assignee)):''}</p><button class="btn g" onclick="closeM()">Close</button>`)}
function tform(id){const t=S.tasks.find(x=>x.id===id)||{status:'todo',priority:'Medium'};modal(`<h3>${id?'Edit':'New'} task</h3><label>Title</label><input id="ft" value="${esc(t.title)}"><label>Description</label><textarea id="fd" rows="3">${esc(t.description)}</textarea><label>Assignee</label><select id="fa"><option value="">Unassigned</option>${S.users.map(u=>`<option value="${u.id}" ${t.assignee===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select><div class="row"><div style="flex:1"><label>Due date</label><input id="fu" type="date" value="${t.due||''}"></div><div style="flex:1"><label>Priority</label><select id="fp">${['Low','Medium','High'].map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select></div></div><label>Status</label><select id="fs">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select><div class="row"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn" onclick="saveT('${id||''}')">Save</button></div>`)}
async function saveT(id){const title=$('#ft').value.trim();if(!title)return alert('Title required');await api('saveTask',{task:{id:id||undefined,title,description:$('#fd').value,assignee:$('#fa').value,due:$('#fu').value,priority:$('#fp').value,status:$('#fs').value}});closeM();load()}
function notify(){if(admin())return;const seen=JSON.parse(localStorage.n||'{}'),kn='k'+S.me.id,known=JSON.parse(localStorage.getItem(kn)||'null'),t=td(),n=tm();
const push=(h,b,k)=>{if(seen[k])return;seen[k]=1;toast('🔔 '+h+': '+b);if(window.Notification&&Notification.permission==='granted')new Notification(h,{body:b})};
S.tasks.forEach(x=>{if(known&&!known.includes(x.id))push('New task assigned',x.title,'new'+x.id);if(x.status==='done'||!x.due)return;if(x.due<t)push('Overdue',x.title,'o'+x.id+t);else if(x.due===t)push('Due today',x.title,'t'+x.id+t);else if(x.due===n)push('Due tomorrow',x.title,'m'+x.id+t)});
localStorage.n=JSON.stringify(seen);localStorage.setItem(kn,JSON.stringify(S.tasks.map(x=>x.id)))}
setInterval(()=>{if(cred&&!$('#modal').classList.contains('on')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))load()},30000);
cred?load():render();
</script></body></html>
